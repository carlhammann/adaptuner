
[package]
name = "adaptuner-stm32"
version = "0.1.0"
edition = "2024"

[dependencies]
adaptuner-core = { path = "../adaptuner-core", default-features = false }

cortex-m = { version = "0.7.9", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"

defmt = { version = "1.2.0", optional = true }
defmt-rtt = { version = "1.3.1", optional = true }

embassy-futures = "0.1.2"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["memory-x", "stm32h743vi", "time-driver-any", "exti", "unstable-pac"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }

panic-halt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }

embedded-alloc = "0.6"
heapless = "0.9.3"

embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-io-async = "0.7.0"

slint = { version = "1.16", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software", "software-renderer-path"] }

postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }

[build-dependencies]
slint-build = "1.16"

[[bin]]
name = "adaptuner-stm32"
test = false
bench = false

[features]
default = ["debug"]
debug = [
    "defmt",
    "defmt-rtt",
    "panic-probe",
    "embassy-stm32/defmt",
    "embassy-time/defmt",
]
