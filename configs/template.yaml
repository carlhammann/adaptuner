          fifth: 2
          third: 2
        11:
          fifth: 1
          third: 1
    initial-reference: {}
  bindings:
    sostenuto-pedal-down: !IncrementNeighbourhoodIndex 1
    sostenuto-pedal-up: !IncrementNeighbourhoodIndex -1
    soft-pedal-down: SetReferenceToLowest
    !key-press Space: !IncrementNeighbourhoodIndex 1
- !two-step
  name: static scales + list of chords
  description: |-
    This strategy allows you to
    • define and switch between scales like the "static scales" strategy,
    • define a list of chords and voicings that have a known tuning, and
    • reset the reference note on the fly, either manually or automatically to the reference note of the currently sounding chord.
  harmony: !chord-list
