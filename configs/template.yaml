- !static-neighbourhoods
  name: static scales
  description: |-
    This strategy allows you to
    • define scales comprising static tunings of all 12 notes as a "neighbourhood" of the reference note,
    • switch between different scales on the fly, and
    • reset the reference note on the fly.
